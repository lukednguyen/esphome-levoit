# Levoit OasisMist 1000S humidifier — ESPHome sample configuration.
#
# Paste this whole file into ESPHome Builder (or the Home Assistant ESPHome
# add-on), adjust the substitutions below, add the secrets listed in
# secrets.yaml.example, and hit Install. Nothing needs to be copied locally.
#
# Hardware: an ESP32-C3 replacing the stock Wi-Fi module. UART @ 115200,
# TX GPIO19 / RX GPIO18.

substitutions:
  name: humidifier
  friendly_name: "Humidifier"
  board: esp32-c3-devkitm-1
  tx_pin: GPIO19
  rx_pin: GPIO18
  # Where the component code comes from. CI overrides this with a local path.
  component_source: github://lukednguyen/esphome-levoit

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: update_wifi_led

external_components:
  - source: ${component_source}
    components: [humidifier_oasismist1000s]
    refresh: 1d

esp32:
  board: ${board}
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key_humidifier

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: update_wifi_led
  on_disconnect:
    - script.execute: update_wifi_led

captive_portal:

web_server:
  port: 80

script:
  - id: update_wifi_led
    mode: restart
    then:
      - lambda: |-
          id(humidifier).send_wifi_status(
            id(api_connected).state,
            wifi::global_wifi_component->is_connected()
          );

binary_sensor:
  - platform: status
    id: api_connected
    on_press:
      - script.execute: update_wifi_led
    on_release:
      - script.execute: update_wifi_led

uart:
  id: uart_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 115200

humidifier_oasismist1000s:
  id: humidifier
  uart_id: uart_bus
  power:
    name: "Power"
  mode:
    name: "Mode"
  target_humidity:
    name: "Target Humidity"
  mist_level:
    name: "Mist Level"
  humidity:
    name: "Humidity"
  display:
    name: "Display"
  reservoir:
    name: "Reservoir"
  water:
    name: "Water Available"
  misting:
    name: "Misting"
