# Levoit Vital 200S air purifier — ESPHome sample configuration.
#
# Paste this whole file into ESPHome Builder (or the Home Assistant ESPHome
# add-on), adjust the substitutions below, add the secrets listed in
# secrets.yaml.example, and hit Install. Nothing needs to be copied locally.
#
# Hardware: the device's built-in ESP32 module (an ESP32-C3) is reflashed in
# place with ESPHome. BACK UP THE STOCK FIRMWARE FIRST (see README) - Levoit's
# firmware is not published and cannot be re-obtained. UART @ 115200, TX GPIO19 /
# RX GPIO18.

substitutions:
  name: air-purifier
  friendly_name: "Air Purifier"
  board: esp32-c3-devkitm-1
  tx_pin: GPIO19
  rx_pin: GPIO18
  # Where the component code comes from. CI overrides this with a local path.
  component_source: github://lukednguyen/esphome-levoit

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: update_wifi_led
      # Forces the purifier on at every boot, overriding the fan's restored
      # state (this runs after PurifierFan::setup()). Delete this line if you
      # would rather honour the state restored from flash. See Q1.
      - fan.turn_on: air_purifier_fan

external_components:
  - source: ${component_source}
    components: [air_purifier_vital200s]
    refresh: 1d

esp32:
  board: ${board}
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key_air_purifier

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: update_wifi_led
  on_disconnect:
    - script.execute: update_wifi_led

captive_portal:

web_server:
  port: 80

script:
  - id: update_wifi_led
    mode: restart
    then:
      - lambda: |-
          id(air_purifier).send_wifi_status(
            id(api_connected).state,
            wifi::global_wifi_component->is_connected()
          );

binary_sensor:
  - platform: status
    id: api_connected
    on_press:
      - script.execute: update_wifi_led
    on_release:
      - script.execute: update_wifi_led

uart:
  id: uart_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 115200

air_purifier_vital200s:
  id: air_purifier
  uart_id: uart_bus
  # Cancel any timer started from the device's own timer button, so the purifier
  # never switches itself off. Off by default.
  # cancel_device_timer: true
  fan:
    id: air_purifier_fan
    name: "Air Purifier"
  pm25:
    name: "PM2.5"
  air_quality:
    name: "Air Quality"
  display:
    name: "Display"
  display_lock:
    name: "Display Lock"
  light_detection:
    name: "Light Detection"
